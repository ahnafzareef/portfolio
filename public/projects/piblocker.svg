<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="800" height="500" fill="#141414"/>

  <!-- terminal window -->
  <rect x="80" y="70" width="640" height="360" rx="10" fill="#1c1c1c" stroke="#2e2e2e" stroke-width="1.5"/>

