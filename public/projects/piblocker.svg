  <rect x="80" y="100" width="640" height="14" fill="#161616"/>
  <line x1="80" y1="114" x2="720" y2="114" stroke="#2e2e2e" stroke-width="1.5"/>
  <circle cx="106" cy="92" r="6" fill="#e23b3b"/>
  <circle cx="128" cy="92" r="6" fill="#3a3a3a"/>
  <circle cx="150" cy="92" r="6" fill="#3a3a3a"/>
  <text x="400" y="96" fill="#6a6a6a" font-size="14" text-anchor="middle" letter-spacing="1">piblocker.py — raspberry pi 3b</text>

