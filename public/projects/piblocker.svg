  <text x="110" y="160" font-size="17">
    <tspan fill="#e23b3b">$</tspan><tspan fill="#fafafa"> sudo python3 piblocker.py</tspan>
  </text>
  <text x="110" y="190" fill="#6a6a6a" font-size="15">listening on 53/udp · upstream 1.1.1.1</text>

  <text x="110" y="232" font-size="16">
    <tspan fill="#e23b3b">blocked  </tspan><tspan fill="#cfcfcf">ads.doubleclick.net</tspan>
  </text>
  <text x="110" y="262" font-size="16">
    <tspan fill="#e23b3b">blocked  </tspan><tspan fill="#cfcfcf">googlesyndication.com</tspan>
  </text>
